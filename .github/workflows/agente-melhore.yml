name: "Agente: Melhore"

on:
  schedule:
    - cron: '0 3 * * *' # Diário às 03:00 UTC (00:00 Horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  melhore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Instalar Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configurar Provider Gemini
        run: |
          mkdir -p ~/.gemini/antigravity-cli
          echo '{"modelProvider": "gemini"}' > ~/.gemini/antigravity-cli/settings.json

      - name: Configurar Git
        run: |
          git config --global user.name "Agente Melhore"
          git config --global user.email "agente@jogodogrupo.local"

      - name: Preparar ambiente na nuvem
        run: |
          npm ci
          npm run nuvem:preparar

      - name: Executar /melhore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.JOGO_DO_GRUPO_GEMINI_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          agy -p "Execute a skill melhore: inspecione a origin/main (regras de produto, código, desempenho e custo de IA), verifique evidências concretas e abra até 5 issues no GitHub com fichas completas para o trabalhe, seguindo as regras do AGENTS.md." --model "models/gemini-3.8-flash" --effort high --dangerously-skip-permissions
