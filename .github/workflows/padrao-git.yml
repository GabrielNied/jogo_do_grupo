name: Padrão do Git

# Com squash merge, o título do PR vira a mensagem do commit na main.
# Por isso o título passa pelo commitlint, além do nome da branch.
# Na main, como o repo é privado no plano gratuito (sem proteção de branch no GitHub),
# um job avisa com check vermelho quando algum commit entra sem PR (ADR 0007).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Push novo no mesmo PR cancela a rodada antiga.
# Editar só a descrição (ex.: `npm run tarefa -- pendencia-unity`, segundos depois de abrir o PR)
# dispara uma rodada que o job pula; ela vai para outro grupo ("-so-descricao") para não cancelar
# a rodada que está validando o título e a branch.
concurrency:
  group: >-
    padrao-git-${{ github.ref }}${{
    github.event_name == 'pull_request'
    && github.event.action == 'edited'
    && github.event.changes.title == null
    && '-so-descricao' || ''
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  padrao-git:
    # "edited" também dispara quando só a descrição muda; só o título importa aqui.
    if: >-
      github.event_name == 'pull_request'
      && (github.event.action != 'edited' || github.event.changes.title != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Título do PR (commitlint)
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITULO" | npx --no -- commitlint --verbose
      - name: Nome da branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: node scripts/git/validar-branch.mjs "$BRANCH"
      - name: Testes dos scripts do repo
        run: npm run testar-scripts
      - name: Contratos de transporte UDP
        run: npm run conferir-contratos-rede
      - name: Namespaces do client e do shared nos asmdef
        run: npm run conferir-asmdef
      - name: Orçamento de contexto das instruções de IA
        run: npm run contexto
      - name: Arquivos do Unity no commit
        env:
          CI: "true"
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/git/conferir-arquivos-unity.mjs "origin/${{ github.base_ref }}" --so-commit

  main-via-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todo commit novo na main veio de um PR?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          falhou=0
          for sha in $(jq -r '.commits[].id' "$GITHUB_EVENT_PATH"); do
            total=$(gh api "repos/$REPO/commits/$sha/pulls" --jq 'length')
            if [ "$total" = "0" ]; then
              sleep 10
              total=$(gh api "repos/$REPO/commits/$sha/pulls" --jq 'length')
            fi
            if [ "$total" = "0" ]; then
              echo "::error::O commit $sha entrou na main sem PR. Todo trabalho vai por branch e PR (docs/git.md)."
              falhou=1
            else
              echo "✔ $sha veio de PR."
            fi
          done
          exit $falhou
