name: "Agente: Trabalhe"

on:
  schedule:
    - cron: '*/30 * * * *' # A cada 30 minutos
  workflow_dispatch:

concurrency:
  group: agente-trabalhe
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  trabalhe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Instalar Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configurar Provider Gemini
        run: |
          mkdir -p ~/.gemini/antigravity-cli
          echo '{"modelProvider": "gemini"}' > ~/.gemini/antigravity-cli/settings.json

      - name: Configurar Git
        run: |
          git config --global user.name "Agente Trabalhe"
          git config --global user.email "agente@jogodogrupo.local"

      - name: Preparar ambiente na nuvem
        run: |
          npm ci
          npm run nuvem:preparar

      - name: Executar /trabalhe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.JOGO_DO_GRUPO_GEMINI_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          agy -p "Execute a skill trabalhe: verifique 'npm run tarefa -- listar', puxe o próximo lote em worktree isolada, implemente contrato, server e client conforme AGENTS.md, valide com testes .NET, formate e abra o PR sem pedir confirmação humana." --model gemini-3.8-flash-high --dangerously-skip-permissions
