name: Server, Shared e testes

# "build" é check obrigatório da main (ADR 0029): em PR roda sempre, porque um check
# obrigatório que não roda trava o PR. Na main só roda quando o código .NET muda.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "tests/**"
      - "*.slnx"
      - "**/*.csproj"
      - "Directory.*"
      - "global.json"
      - "dotnet-tools.json"
      - ".github/workflows/server.yml"
  pull_request:

# issues: write para abrir a issue de main quebrada (passo no fim do job).
permissions:
  contents: read
  issues: write

# Push novo no mesmo PR cancela a rodada antiga (na main, todas rodam).
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jogodogrupo_teste
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      TESTE_POSTGRES_CONEXAO: "Host=localhost;Port=5432;Database=jogodogrupo_teste;Username=postgres;Password=postgrespassword"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build JogoDoGrupo.slnx -c Release
      - name: Testes
        run: >-
          dotnet test JogoDoGrupo.slnx -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults
      # Cobertura vai para o resumo da rodada (aba Summary do check). Informativo:
      # não reprova o PR, serve para o autor e o revisor verem o que ficou sem teste.
      - name: Resumo da cobertura
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5.5.10
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/relatorio
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: "-*.Tests"
      - name: Publicar resumo
        if: always()
        run: |
          if [ -f TestResults/relatorio/SummaryGithub.md ]; then
            cat TestResults/relatorio/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Build vermelho na main: uma issue core por quebra (mesmo molde do Client Unity, ADR 0019).
      - name: Abre issue quando a main quebra
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          aberta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=core&per_page=50" \
            -q '[.[] | select(.title | startswith("[Core] Build falhou na main"))][0].number // empty')
          if [ -n "$aberta" ]; then
            gh api -X POST "repos/${{ github.repository }}/issues/$aberta/comments" \
              -f body="Falhou de novo no commit ${GITHUB_SHA}: $LINK"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title="[Core] Build falhou na main (${GITHUB_SHA::7})" \
            -f labels[]=core \
            -f body="O workflow Server, Shared e testes falhou depois do merge do commit ${GITHUB_SHA}: $LINK

          **Falta:**
          - [ ] Corrigir o build ou os testes na \`main\` (ex.: \`dotnet build JogoDoGrupo.slnx -c Release\` e \`dotnet test JogoDoGrupo.slnx -c Release\`).
          - [ ] PRs abertos: atualizar a branch com a \`main\` depois do conserto.

          Puxe com \`npm run tarefa -- puxar <este número>\` para assumir o conserto."
