name: Formatação

# Roda em todo PR, mesmo sem C# (leva ~30 s): "csharpier" é check obrigatório da main
# (ADR 0029), e um check obrigatório que não roda trava o PR. Não roda de novo na main: ela só
# recebe squash de PR, que já passou por aqui.
on:
  pull_request:

concurrency:
  group: formatacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharpier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - id: conferir
        run: dotnet csharpier check .
      # Sessões de IA na nuvem não têm .NET nem conseguem ler o log deste job: o diff vai
      # para um comentário do PR, que a API entrega, e o agente aplica com `git apply`.
      # PR de fork não recebe permissão de escrita, então fica só com o log.
      - name: Publica o diff da formatação no PR
        if: >-
          failure() && steps.conferir.outcome == 'failure'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          dotnet csharpier format .
          {
            echo '<!-- csharpier-diff -->'
            echo 'O `dotnet csharpier check .` falhou. Rode `dotnet csharpier format .` ou aplique este diff com `git apply`:'
            echo
            echo '```diff'
            git diff | head -c 60000
            echo '```'
          } > "$RUNNER_TEMP/csharpier-diff.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/csharpier-diff.md" --edit-last --create-if-none
