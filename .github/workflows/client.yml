name: Client (Unity)

# Compila o client e roda os testes EditMode num Unity de verdade (GameCI), para que quem não
# tem Unity na máquina, como um agente na nuvem, não precise fazer isso localmente (ADR 0017).
#
# Só roda em PR que mexe no client ou no shared, para poupar os minutos do plano gratuito.
# Por isso não é check obrigatório da main: com filtro de paths, um check obrigatório que não
# roda deixa o PR travado (veja server.yml).
#
# Precisa dos secrets UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD (licença Personal).
# Sem eles, o job só avisa e passa.
on:
  pull_request:
    paths:
      - "client/**"
      - "shared/Package/**"
      - ".github/workflows/client.yml"

permissions:
  contents: read
  checks: write

concurrency:
  group: client-unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEM_LICENCA: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Licença do Unity configurada?
        if: env.TEM_LICENCA != 'true'
        run: echo "::warning::Sem o secret UNITY_LICENSE o client não foi compilado nem testado. Veja docs/decisoes/0017-unity-no-ci.md."

      # Sem LFS: os testes EditMode não usam modelos e texturas, e LFS gasta a cota de banda.
      - uses: actions/checkout@v4
        if: env.TEM_LICENCA == 'true'
        with:
          lfs: false

      - uses: actions/cache@v4
        if: env.TEM_LICENCA == 'true'
        with:
          path: client/Library
          key: Library-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('client/Assets/**', 'shared/Package/**') }}
          restore-keys: |
            Library-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-
            Library-

      # Compila todos os assemblies (erro de compilação reprova) e roda os testes EditMode.
      - uses: game-ci/unity-test-runner@v4
        if: env.TEM_LICENCA == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: editmode
          githubToken: ${{ github.token }}
          checkName: Testes EditMode (Unity)

      - uses: actions/upload-artifact@v4
        if: always() && env.TEM_LICENCA == 'true'
        with:
          name: resultados-unity
          path: artifacts
