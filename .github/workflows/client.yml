name: Client (Unity)

# Compila o client e roda os testes EditMode num Unity de verdade (GameCI), para que quem não
# tem Unity na máquina, como um agente na nuvem, não precise fazer isso localmente (ADR 0019).
#
# Leva uns 10 minutos, então não roda em cada PR (não atrasa ninguém nem gasta a cota à toa):
# - depois do merge na main, se mexeu no client ou no shared. A execução em andamento termina
#   (cancelar a cada merge fazia quase nenhuma chegar ao fim). Main e PRs dividem uma fila só,
#   porque a licença Personal não aguenta dois Unity ao mesmo tempo; a fila guarda só o pedido
#   mais novo, então um lote de merges gera uma execução a mais, não uma por merge. Se passar,
#   fecha as pendências que só pediam compilar e rodar os testes EditMode;
# - num PR, só quando alguém põe a label "testar-unity" (ADR 0034): quem abre o PR já rodou o
#   unity:compilar, e o Unity em todo PR dobrava o custo e disputava a licença com o Unity local;
# - de 2 em 2 horas, só se o commit atual da main ainda não terminou uma execução (a dele pode
#   ter sido trocada na fila por um PR, já que a fila guarda só o mais novo);
# - à mão, em Actions > Client (Unity) > Run workflow.
# Se falhar na main, abre uma pendência "pendente-unity" para o próximo agente com Unity.
# Não é check obrigatório.
#
# Precisa dos secrets UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD (licença Personal).
# Sem eles, o job só avisa e passa.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/Package/**"
      - ".github/workflows/client.yml"
  pull_request:
    types: [labeled]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  # Listar as execuções deste workflow (agendamento que confere se a main já foi validada) e
  # apagar o cache da Library quando o editor morre.
  actions: write
  contents: read
  checks: write
  issues: write
  # GET /pulls/{n} do script que fecha pendências. Sem isto o token devolve 403 e o job
  # fica vermelho mesmo quando a compilação e os testes EditMode passaram.
  pull-requests: read

jobs:
  # No agendamento: só roda se o commit atual da main não tem execução terminada (passou ou
  # falhou) deste workflow. Cancelada não conta: é a que a fila trocou por um PR.
  main-sem-validar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      rodar: ${{ steps.conferir.outputs.rodar }}
    steps:
      - id: conferir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terminadas=$(gh api "repos/${{ github.repository }}/actions/workflows/client.yml/runs?head_sha=${{ github.sha }}&status=completed&per_page=50" \
            -q '[.workflow_runs[] | select(.event != "pull_request") | select(.conclusion == "success" or .conclusion == "failure")] | length')
          if [ "$terminadas" = "0" ]; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "A main em ${GITHUB_SHA::7} já foi validada; nada a fazer."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          fi

  testes:
    needs: [main-sem-validar]
    # Main e à mão sempre rodam; o agendamento, só se a main ainda não foi validada. Em PR:
    # só quando a label testar-unity acabou de ser posta.
    if: >-
      !cancelled() && (
        github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'schedule' && needs.main-sem-validar.outputs.rodar == 'true')
        || (github.event.action == 'labeled' && github.event.label.name == 'testar-unity')
      )
    # Um Unity por vez no repositório inteiro (main e todos os PRs): a licença Personal é uma
    # só, e ativá-la num runner mata com "Killed" (exit 137) o editor que já roda em outro
    # (issue #529). Nada em andamento é cancelado; quem chega espera, e a fila guarda só o
    # mais novo. No job (não no workflow): um evento que não roda o Unity não entra na fila.
    concurrency:
      group: client-unity-licenca
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEM_LICENCA: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Licença do Unity configurada?
        if: env.TEM_LICENCA != 'true'
        run: echo "::warning::Sem o secret UNITY_LICENSE o client não foi compilado nem testado. Veja docs/decisoes/0019-unity-no-ci.md."

      # A imagem do Unity não cabe no disco livre do runner. Remove SDKs pré-instalados que
      # este job não usa (Android, .NET, Haskell, CodeQL): libera mais de 20 GB.
      - name: Libera espaço em disco
        if: env.TEM_LICENCA == 'true'
        # Só os dois maiores (~15 GB): apagar tudo e limpar o docker levava 3 minutos.
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      # Os testes do hub conferem os modelos (.fbx), que estão no LFS. Para não gastar a cota de
      # banda do LFS (1 GB/mês grátis) a cada execução, os arquivos ficam no cache do Actions
      # (grátis) e o git lfs pull só baixa o que mudou desde a última vez.
      - uses: actions/checkout@v4
        if: env.TEM_LICENCA == 'true'
        with:
          lfs: false

      - name: Lista os arquivos LFS
        if: env.TEM_LICENCA == 'true'
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-arquivos

      - uses: actions/cache@v4
        if: env.TEM_LICENCA == 'true'
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-arquivos') }}
          restore-keys: lfs-

      - name: Baixa só os arquivos LFS que faltam
        if: env.TEM_LICENCA == 'true'
        run: git lfs pull

      # v3 (#600), como o v2 (#529): os jobs que morriam com "Killed" restauravam todos o mesmo
      # cache da Library; o prefixo novo descarta os anteriores. Se voltar a acontecer, o passo
      # "Descarta a Library" abaixo apaga o cache sozinho.
      - uses: actions/cache@v4
        if: env.TEM_LICENCA == 'true'
        with:
          path: client/Library
          key: Library-v3-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('client/Assets/**', 'shared/Package/**') }}
          restore-keys: |
            Library-v3-${{ hashFiles('client/Packages/packages-lock.json', 'client/ProjectSettings/ProjectVersion.txt') }}-
            Library-v3-

      # Compila todos os assemblies (erro de compilação reprova) e roda os testes EditMode.
      - uses: game-ci/unity-test-runner@v4
        id: testes-editmode
        if: env.TEM_LICENCA == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: editmode
          # Imagem "base" (sem módulos de build): os testes EditMode não precisam de IL2CPP.
          # Atualize junto com client/ProjectSettings/ProjectVersion.txt quando o Unity mudar.
          customImage: unityci/editor:ubuntu-6000.6.5f1-base-3
          githubToken: ${{ github.token }}
          checkName: Testes EditMode (Unity)

      - uses: actions/upload-artifact@v4
        if: always() && env.TEM_LICENCA == 'true'
        with:
          name: resultados-unity
          path: artifacts

      # O editor morreu antes de gravar os resultados (ex.: "Killed", exit 137): a Library
      # restaurada pode estar envenenada e mataria todas as execuções seguintes (#529, #600).
      # Apaga os caches dela; a próxima importa do zero. Falha de teste comum mantém o cache.
      - name: Descarta a Library se o editor morreu
        if: failure() && steps.testes-editmode.outcome == 'failure' && hashFiles('artifacts/editmode-results.xml') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for chave in $(gh cache list --repo "${{ github.repository }}" --key Library- --limit 100 --json key -q '.[].key'); do
            gh cache delete "$chave" --repo "${{ github.repository }}" || true
          done

      # Passou na main: fecha as pendências que só pediam o que este job acabou de fazer.
      - name: Fecha pendências resolvidas pelo CI
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule') && env.TEM_LICENCA == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/git/fechar-pendencias-do-ci.mjs "$GITHUB_SHA" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Quebrou na main: vira pendência para o próximo agente com Unity (ADR 0019).
      - name: Abre pendência de Unity
        # Só quando os testes EditMode falharam. Uma falha ao fechar pendências não é client quebrado.
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule') && steps.testes-editmode.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Se já há uma pendência aberta de falha na main, comenta nela em vez de abrir outra.
        run: |
          aberta=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=pendente-unity&per_page=50" \
            -q '[.[] | select(.title | startswith("[Unity] Client falhou na main"))][0].number // empty')
          if [ -n "$aberta" ]; then
            gh api -X POST "repos/${{ github.repository }}/issues/$aberta/comments" \
              -f body="Falhou de novo no commit ${GITHUB_SHA}: $LINK"
            exit 0
          fi
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title="[Unity] Client falhou na main (${GITHUB_SHA::7})" \
            -f labels[]=pendente-unity \
            -f body="O workflow Client (Unity) falhou depois do merge do commit ${GITHUB_SHA}: $LINK

          **Falta:**
          - [ ] Ver o log, corrigir a compilação ou os testes EditMode e confirmar com \`npm run unity:compilar\` e \`npm run unity:testes\`.

          Puxe com \`npm run tarefa -- puxar <este número>\` (cria uma branch nova a partir da main)."
